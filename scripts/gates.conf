# One gate per line:  name | directory (from the repo root) | command
# A gate that cannot fail is not a gate. Code gates are added with the first code, not before.
md-wrap   | .  | python3 scripts/md_wrap_check.py
adr-check | .  | python3 scripts/adr_check.py
private   | .  | python3 scripts/private_check.py
tests     | .  | .venv/bin/python -m unittest discover -s tests -t .
# The page's gates (ADR 002, decision 8). They need Node 24 (`nvm use`, ADR 005) and `npm ci` in web/ first. web-lint is type-aware and
# also runs the probe that proves the linter still fails on known faults (ADR 007, amendment of 2026-10-18). e2e runs the built page in Chromium against a sample vault (ADR 006); it needs the browser
# (`npx playwright install chromium` in web/) and `.venv`, and comes after web-build.
web-types  | web | npm run typecheck
web-lint   | web | npm run lint && npm run lint:probe
web-tests  | web | npm test
web-build  | web | npm run build
e2e        | web | npm run e2e
