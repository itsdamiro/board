# One gate per line:  name | directory (from the repo root) | command
# A gate that cannot fail is not a gate. Code gates are added with the first code, not before.
md-wrap   | .  | python3 scripts/md_wrap_check.py
adr-check | .  | python3 scripts/adr_check.py
private   | .  | python3 scripts/private_check.py
tests     | .  | python3 -m unittest discover -s tests -t .
